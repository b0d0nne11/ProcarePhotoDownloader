[project]
name = "procare-photo-downloader"
dynamic = ["version"]
description = "Bulk download photos and videos for your children from Procare Connect"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "pathvalidate>=3.3.1",
    "platformdirs>=4.11.5",
    "pydantic-settings>=2.0",
    "rich>=13.7",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
]

[project.scripts]
procare-photos = "procare_photo_downloader.cli:main"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-freezegun>=0.4.2",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --no-cov-on-fail"

[tool.coverage.run]
source = ["procare_photo_downloader"]
omit = [
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/procare_photo_downloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/procare_photo_downloader"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Procare timestamps are school-local; comparing against the local date is
    # the intended behaviour, not a bug.
    "DTZ011",
]
