# Maintainer-only config. At runtime Catalog builds its own Config and hands
# Alembic the engine for whichever library is being opened, because every
# output directory carries its own catalog. This file exists so that
#
#     uv run alembic revision --autogenerate -m "what changed"
#
# has somewhere to point. The scratch database it names is disposable.

[alembic]
script_location = src/procare_photo_downloader/migrations
sqlalchemy.url = sqlite:///.alembic-scratch.sqlite3
